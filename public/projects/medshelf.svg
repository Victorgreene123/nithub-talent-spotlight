<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#F1F5F9"/>
  <!-- Browser Window -->
  <rect x="40" y="36" width="720" height="464" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
