  <circle cx="66" cy="56" r="5" fill="#475569"/>
  <circle cx="84" cy="56" r="5" fill="#475569"/>
  <circle cx="102" cy="56" r="5" fill="#475569"/>
  <rect x="260" y="46" width="280" height="20" rx="4" fill="#1E293B"/>
  <text x="400" y="60" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">medshelf.ng/inventory</text>
  <!-- Sidebar -->
  <rect x="41" y="76" width="150" height="423" fill="#F8FAFC"/>
